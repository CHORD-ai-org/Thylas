<svg viewBox="0 0 680 300" width="100%" role="img" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<title>项目桌面状态流</title>
<desc>三个状态面板：空项目首次进入显示引导一行字，有待审产出时新卡组高亮并显示待审计数，Esc 返回项目地图</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<clipPath id="p1"><rect x="40" y="56" width="180" height="150" rx="10"/></clipPath>
<clipPath id="p2"><rect x="250" y="56" width="180" height="150" rx="10"/></clipPath>
<clipPath id="p3"><rect x="460" y="56" width="180" height="150" rx="10"/></clipPath>
</defs>
<rect x="40" y="56" width="180" height="150" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<g clip-path="url(#p1)">
<rect x="40" y="56" width="180" height="22" fill="#E9E6DE"/>
<rect x="40" y="66" width="180" height="12" fill="#E9E6DE"/>
<rect x="40" y="78" width="34" height="128" fill="#E9E6DE"/>
<text x="137" y="128" font-size="11" fill="#444441" text-anchor="middle" dominant-baseline="central">把材料带进来</text>
<text x="137" y="150" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">连接文件夹或拖入文件</text>
</g>
<rect x="250" y="56" width="180" height="150" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<g clip-path="url(#p2)">
<rect x="250" y="56" width="180" height="22" fill="#E9E6DE"/>
<rect x="250" y="66" width="180" height="12" fill="#E9E6DE"/>
<rect x="250" y="78" width="34" height="128" fill="#E9E6DE"/>
<rect x="386" y="78" width="44" height="128" fill="#E9E6DE"/>
<rect x="298" y="92" width="48" height="18" rx="9" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="322" y="101" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">3 项</text>
<rect x="298" y="122" width="64" height="20" rx="4" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/>
<rect x="308" y="148" width="64" height="20" rx="4" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/>
<rect x="298" y="174" width="64" height="20" rx="4" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/>
</g>
<rect x="460" y="56" width="180" height="150" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<g clip-path="url(#p3)">
<rect x="460" y="56" width="180" height="22" fill="#E9E6DE"/>
<rect x="460" y="66" width="180" height="12" fill="#E9E6DE"/>
<rect x="484" y="104" width="60" height="34" rx="6" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="560" y="128" width="60" height="34" rx="6" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="472" y="82" width="32" height="18" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="488" y="91" font-size="11" fill="#444441" text-anchor="middle" dominant-baseline="central">Esc</text>
</g>
<text x="130" y="238" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">① 空项目 · 首次进入</text>
<text x="340" y="238" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">② 有待审 · 新卡组高亮</text>
<text x="550" y="238" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">③ Esc · 回项目地图</text>
<path d="M224 131 L246 131" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow3)"/>
<path d="M434 131 L456 131" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow3)"/>
</svg>
