<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F1EBDD" />
    <title>Thylas</title>
    <!-- The SVG is the source; the 32px PNG is the fallback for browsers that
         will not take an SVG icon, and the 180px one is the iOS home screen. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* pre-paint ground so the first frame is the stored theme, not white */
      html, body { margin: 0; height: 100%; background: #F1EBDD; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #0A0A0A; }
      html[data-theme='light'], html[data-theme='light'] body { background: #FFFFFF; }
    </style>
    <script>
      /* Runs before first paint: read the stored theme, set the attribute, and
         paint the matching ground. 200 bytes, no dependencies, no flash. */
      try {
        var t = (JSON.parse(localStorage.getItem('thylas:user:v1') || '{}').prefs || {}).theme;
        t = t === 'dark' || t === 'light' ? t : 'warm';
        document.documentElement.dataset.theme = t;
        var meta = document.querySelector('meta[name="theme-color"]');
        var color = t === 'dark' ? '#0A0A0A' : t === 'light' ? '#FFFFFF' : '#F1EBDD';
        if (meta) meta.setAttribute('content', color);
      } catch (e) { /* defaults apply */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
